<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>像素塔防 - Pixel Tower Defense</title>
<style>
/* ================= 基础 ================= */
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0e0e18;overscroll-behavior:none;touch-action:none}
body{font-family:'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:#eee}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#232340,#0d0d17)}
#wrap{position:relative;width:832px;height:652px;flex:none;transform-origin:center center;
  box-shadow:0 0 80px rgba(0,0,0,.7),0 0 0 2px #000;border-radius:10px;overflow:hidden}
canvas{position:absolute;inset:0;width:832px;height:652px;display:block;background:#4f7d3b}
.layer{position:absolute}
.hidden{display:none!important}

/* ================= HUD ================= */
#hud{top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;background:linear-gradient(#30304a,#202038);border-bottom:2px solid #000;z-index:5;font-size:14px}
.hud-left{display:flex;align-items:center;gap:16px;min-width:280px}
.stat{display:flex;align-items:center;gap:6px;font-weight:700}
.stat b{color:#ffd93d;font-size:17px;min-width:52px}
.hpwrap{display:flex;align-items:center;gap:6px}
.hpbar{width:130px;height:14px;background:#3a1020;border:1px solid #000;border-radius:7px;overflow:hidden}
#hudHpFill{height:100%;width:100%;background:#4ade80;transition:width .15s}
#hudHpText{font-size:12px;color:#ffb3b3;min-width:44px}
.hud-center{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
#hudWave{font-weight:800;font-size:15px;letter-spacing:1px;color:#fff}
#hudPhase{font-size:12px;color:#9ecbff;min-height:14px}
.hud-right{display:flex;align-items:center;gap:8px;min-width:280px;justify-content:flex-end}
.btn{background:#3b4057;color:#eee;border:1px solid #000;border-radius:6px;padding:5px 10px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{background:#4a5070}
.btn:active{transform:translateY(1px)}
.btn.gold{background:#7a5a16;color:#ffd93d}
.btn.gold:hover{background:#8f6a1a}
#btnEarly{display:none;animation:pulse 1.1s ease infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,217,61,.5)}50%{box-shadow:0 0 0 6px rgba(255,217,61,0)}}

/* ================= 建造栏 ================= */
#buildbar{bottom:0;left:0;right:0;height:96px;display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:linear-gradient(#202038,#17172a);border-top:2px solid #000;z-index:5}
.buildbtn{width:150px;height:78px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:#2c2f45;border:2px solid #4a4f6d;border-radius:8px;color:#eee;cursor:pointer;font-family:inherit;transition:transform .06s}
.buildbtn:hover{border-color:#8f9bd6;background:#343854}
.buildbtn.sel{border-color:#ffd93d;background:#4a4426;box-shadow:0 0 12px rgba(255,217,61,.35)}
.buildbtn.off{opacity:.42;pointer-events:none}
.b-ico{font-size:24px;line-height:1}
.b-name{font-size:14px;font-weight:800}
.b-cost{font-size:12px;color:#ffd93d}
.b-key{position:absolute;top:3px;left:6px;font-size:10px;color:#8f9bd6;background:#1d2030;border:1px solid #4a4f6d;border-radius:3px;padding:0 4px}
.bar-help{margin-left:auto;width:190px;font-size:11px;color:#8b8fae;line-height:1.7;text-align:right}

/* ================= 选中面板 ================= */
#towerPanel{right:10px;bottom:104px;width:236px;background:rgba(18,18,32,.95);border:2px solid #4a4f6d;border-radius:10px;
  padding:10px 12px;z-index:6;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.p-title{font-size:15px;font-weight:800;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.p-title .lv{color:#ffd93d;font-size:12px;background:#3a3418;padding:1px 7px;border-radius:9px}
.p-row{font-size:12px;color:#c9cde8;margin:2px 0;display:flex;justify-content:space-between}
.p-row span{color:#9fe8ff}
.p-next{font-size:11px;color:#7dff9a;margin-top:4px}
.p-btns{display:flex;gap:8px;margin-top:8px}
.p-btns .btn{flex:1;padding:7px 0;font-size:13px}
.btn:disabled{opacity:.4;pointer-events:none}

/* ================= 横幅 ================= */
#banner{top:62px;left:0;right:0;text-align:center;font-size:34px;font-weight:900;color:#ffd93d;letter-spacing:5px;
  text-shadow:0 2px 0 #000,0 0 20px rgba(255,217,61,.55);opacity:0;pointer-events:none;z-index:8;
  font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
#banner.boss{color:#ff5b5b;text-shadow:0 2px 0 #000,0 0 24px rgba(255,60,60,.75)}
#banner.show{animation:bn 2.6s ease forwards}
@keyframes bn{0%{opacity:0;transform:translateY(-16px) scale(.7)}12%{opacity:1;transform:none}76%{opacity:1}100%{opacity:0;transform:translateY(10px)}}

/* ================= 覆盖层菜单 ================= */
.overlay{inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,8,16,.86);z-index:20}
.box{background:linear-gradient(#2a2a44,#1b1b30);border:2px solid #4a4f6d;border-radius:14px;padding:30px 44px;
  text-align:center;box-shadow:0 10px 60px rgba(0,0,0,.8);max-width:560px}
.box h1{font-size:40px;letter-spacing:6px;color:#ffd93d;text-shadow:0 3px 0 #000,0 0 24px rgba(255,217,61,.4);margin-bottom:2px}
.box .sub{color:#8f9bd6;font-size:13px;letter-spacing:3px;margin-bottom:22px}
.box h2{font-size:26px;margin-bottom:14px}
.diff-row{display:flex;justify-content:center;gap:12px;margin-bottom:22px}
.diff{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:700;
  background:#22253a;border:2px solid #4a4f6d;color:#c9cde8}
.diff input{display:none}
.diff:has(input:checked){border-color:#ffd93d;background:#4a4426;color:#ffd93d}
.big{background:#ffd93d;color:#241a00;border:none;border-radius:10px;padding:12px 54px;font-size:19px;font-weight:900;cursor:pointer;font-family:inherit;letter-spacing:4px}
.big:hover{background:#ffe27a}
.big.blue{background:#3d7bd9;color:#fff}.big.blue:hover{background:#5490ea}
.big.red{background:#d94f3d;color:#fff}.big.red:hover{background:#e8654f}
.big.green{background:#3fae5a;color:#fff}.big.green:hover{background:#51c66d}
.help{margin-top:20px;font-size:11.5px;color:#8b8fae;line-height:1.9}
.menu-btns{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:6px}
#endTitle{font-size:34px;font-weight:900;letter-spacing:3px}
#endTitle.win{color:#7dff9a;text-shadow:0 0 20px rgba(125,255,154,.5)}
#endTitle.lose{color:#ff6b6b;text-shadow:0 0 20px rgba(255,107,107,.5)}
#endSub{margin:8px 0 4px;color:#c9cde8;font-size:15px}
#endScore{margin:8px 0;font-size:26px;font-weight:900;color:#ffd93d}
#endStats{margin-bottom:20px;font-size:13px;color:#8b8fae}
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="cv"></canvas>

    <!-- 顶部 HUD -->
    <div id="hud" class="layer">
      <div class="hud-left">
        <div class="stat"><span>🪙</span><b id="hudGold">200</b></div>
        <div class="hpwrap"><span>❤️</span><div class="hpbar"><div id="hudHpFill"></div></div><span id="hudHpText">20/20</span></div>
      </div>
      <div class="hud-center">
        <div id="hudWave">第 1 / 20 波</div>
        <div id="hudPhase">准备中…</div>
      </div>
      <div class="hud-right">
        <button class="btn" id="btnStrategy" title="切换索敌策略（快捷键 T）">🎯 最前</button>

      <button class="buildbtn" id="btnBuild-cannon"><span class="b-key">2</span><span class="b-ico">💣</span><span class="b-name">炮塔</span><span class="b-cost">🪙 110</span></button>
      <button class="buildbtn" id="btnBuild-frost"><span class="b-key">3</span><span class="b-ico">❄️</span><span class="b-name">冰霜塔</span><span class="b-cost">🪙 90</span></button>
      <button class="buildbtn" id="btnBuild-laser"><span class="b-key">4</span><span class="b-ico">⚡</span><span class="b-name">激光塔</span><span class="b-cost">🪙 160</span></button>
      <div class="bar-help">
        放置后点击塔可选中 · 右键/ESC 取消放置<br>
        U 升级 · S 出售 · 空格 提前开波<br>

    <!-- 选中塔信息面板 -->
    <div id="towerPanel" class="layer hidden">
      <div id="panelBody"></div>
      <div class="p-btns">
        <button class="btn gold" id="btnUpgrade">升级</button>
        <button class="btn red" id="btnSell">出售</button>
      </div>
    </div>

    <!-- 波次横幅 -->
    <div id="banner"></div>

    <!-- 开始菜单 -->
    <div id="menu" class="layer overlay">
      <div class="box">
        <h1>🏰 像素塔防</h1>
        <div class="sub">PIXEL TOWER DEFENSE</div>
        <div class="diff-row">
          <label class="diff"><input type="radio" name="diff" id="diff-easy" value="easy"><span>😊 简单</span></label>
          <label class="diff"><input type="radio" name="diff" id="diff-normal" value="normal" checked><span>⚔️ 普通</span></label>
          <label class="diff"><input type="radio" name="diff" id="diff-hard" value="hard"><span>🔥 困难</span></label>
        </div>
        <button class="big" id="btnStart">开始游戏</button>
        <div class="help">
          操作：1-4 选择塔 · 点击放置（绿=可放/红=不可放）· 右键或 ESC 取消放置<br>
          U 升级 · S 出售 · P 暂停 · 空格 提前开始下一波 · T 切换索敌 · M 静音<br>
          共 20 波进攻，守住基地！
        </div>
      </div>
    </div>

    <!-- 暂停菜单 -->
    <div id="pauseMenu" class="layer overlay hidden">
      <div class="box">
        <h2>⏸ 已暂停</h2>
        <div class="menu-btns">
          <button class="big green" id="btnPauseResume">继续游戏</button>
          <button class="big blue" id="btnPauseRestart">重新开始</button>
          <button class="big" id="btnPauseMenu">返回主菜单</button>
        </div>
      </div>

    <!-- 结束界面 -->
    <div id="endScreen" class="layer overlay hidden">
      <div class="box">
        <div id="endTitle"></div>
        <div id="endSub"></div>
        <div id="endScore"></div>
        <div id="endStats"></div>
        <div class="menu-btns">
          <button class="big green" id="btnEndRestart">重新开始</button>
          <button class="big" id="btnEndMenu">返回主菜单</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
/* ============================================================
   1. 配置与常量
============================================================ */
const CELL = 32, COLS = 26, ROWS = 16;
const MAP_W = COLS * CELL, MAP_H = ROWS * CELL;
const HUD_H = 44, BAR_H = 96;
const W = MAP_W, H = MAP_H + HUD_H + BAR_H;   // 832 x 652
const TOP = HUD_H;                            // 地图区 y 偏移

// 路径路点（格子坐标；车道画在格线之间 → 路径恰好 2 格宽）
const WAYPOINTS = [
  {x:-0.5, y:2.0}, {x:24.0, y:2.0}, {x:24.0, y:6.0}, {x:2.0, y:6.0},
  {x:2.0, y:10.0}, {x:24.0, y:10.0}, {x:24.0, y:14.0}, {x:2.0, y:14.0}, {x:25.5, y:14.0}
];
const BASE_PT = {x:25.5, y:14.0};
const W_PX = WAYPOINTS.map(w => ({x:w.x * CELL, y:TOP + w.y * CELL}));
const BASE_PX = {x:BASE_PT.x * CELL, y:TOP + BASE_PT.y * CELL};

// 路径格子（2 格宽光栅化）
const pathGrid = Array.from({length:ROWS}, () => Array(COLS).fill(false));
function distToSeg(px, py, ax, ay, bx, by){
  const dx = bx - ax, dy = by - ay;
  const len2 = dx*dx + dy*dy || 1;
  let t = ((px-ax)*dx + (py-ay)*dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t*dx, cy = ay + t*dy;
  return Math.hypot(px-cx, py-cy);
}
(function buildPath(){
  const STEP = 0.1;
  for (let cy = 0; cy < ROWS; cy++) for (let cx = 0; cx < COLS; cx++){
    const px = cx + 0.5, py = cy + 0.5;
    for (let i = 0; i < WAYPOINTS.length - 1; i++){
      const a = WAYPOINTS[i], b = WAYPOINTS[i+1];
      const segLen = Math.hypot(b.x-a.x, b.y-a.y);
      let d = Infinity;
      for (let t = 0; t <= segLen + STEP; t += STEP){
        const s = Math.min(1, t / segLen);
        const sx = a.x + (b.x-a.x)*s, sy = a.y + (b.y-a.y)*s;
        d = Math.min(d, Math.hypot(px-sx, py-sy));
        if (d <= 0.9) break;
      }
      if (d <= 0.9){ pathGrid[cy][cx] = true; break; }
    }
  }
})();

// 塔配置
const TOWER_TYPES = {
  arrow:  {key:'arrow',  name:'箭塔',   desc:'攻速快·单体·可对空', cost:60,  up:[40,70],   antiAir:true,  projSpeed:430,
           lvls:[{dmg:8,  rate:2.5, range:130}, {dmg:14, rate:3.0, range:150}, {dmg:22, rate:3.5, range:175}]},
  cannon: {key:'cannon', name:'炮塔',   desc:'射程远·范围溅射',     cost:110, up:[70,120],  antiAir:false, projSpeed:240,
           lvls:[{dmg:26, rate:0.75, range:175, splash:60}, {dmg:40, rate:0.85, range:200, splash:70}, {dmg:62, rate:1.0, range:230, splash:80}]},
  frost:  {key:'frost',  name:'冰霜塔', desc:'减速敌人·低伤害',     cost:90,  up:[60,100],  antiAir:false,
           lvls:[{dmg:2,  rate:1.2, range:120, slow:0.35, slowDur:1.2}, {dmg:4, rate:1.4, range:140, slow:0.45, slowDur:1.6}, {dmg:6, rate:1.6, range:160, slow:0.55, slowDur:2.0}]},
  laser:  {key:'laser',  name:'激光塔', desc:'持续射线·越远越强',   cost:160, up:[90,150],  antiAir:true,
           lvls:[{dps:34, range:150}, {dps:52, range:170}, {dps:74, range:195}]}
};

// 敌人配置
const ENEMY_TYPES = {
  normal: {name:'普通兵', hp:40,  speed:60,  gold:8,  leak:1, r:10, color:'#e5533d', shape:'circle'},
  fast:   {name:'快速兵', hp:25,  speed:105, gold:10, leak:1, r:8,  color:'#f2b13c', shape:'tri'},
  heavy:  {name:'重甲兵', hp:150, speed:38,  gold:15, leak:3, r:13, color:'#4a6fa5', shape:'hex', slowResist:0.5},
  flying: {name:'飞行兵', hp:32,  speed:95,  gold:12, leak:1, r:9,  color:'#9b5de5', shape:'bat', flying:true},
  boss:   {name:'Boss',   hp:2000,speed:35,  gold:200,leak:6, r:24, color:'#8d2f2f', shape:'boss', slowImmune:true, boss:true}
};

// 20 波敌人组合 [类型, 数量]
const WAVES = [
  {comps:[['normal',6]]},
  {comps:[['normal',8],['fast',3]]},
  {comps:[['fast',8]]},
  {comps:[['normal',10],['heavy',3]]},
  {comps:[['boss',1],['normal',8]]},
  {comps:[['fast',12],['flying',6]]},
  {comps:[['heavy',8],['normal',6]]},
  {comps:[['flying',10],['fast',6]]},
  {comps:[['normal',12],['heavy',6],['fast',6]]},
  {comps:[['boss',1],['flying',8],['normal',10]]},
  {comps:[['heavy',12],['flying',8]]},
  {comps:[['fast',18],['normal',12]]},
  {comps:[['flying',14],['heavy',8],['fast',8]]},
  {comps:[['normal',16],['heavy',10],['flying',8]]},
  {comps:[['boss',1],['fast',14],['flying',10],['heavy',6]]},
  {comps:[['flying',20],['fast',16]]},
  {comps:[['heavy',16],['normal',14],['flying',10]]},
  {comps:[['fast',20],['flying',14],['heavy',10]]},
  {comps:[['normal',20],['heavy',14],['flying',12],['fast',10]]},
  {comps:[['boss',2],['flying',16],['heavy',14],['fast',14],['normal',12]]}
];
const BOSS_WAVES = new Set([5, 10, 15, 20]);

// 难度
const DIFFS = {
  easy:   {name:'简单', hp:0.70, speed:0.92, gold:1.25, baseHp:30, prep:20},
  normal: {name:'普通', hp:1.0,  speed:1.0,  gold:1.0,  baseHp:20, prep:15},
  hard:   {name:'困难', hp:1.12, speed:1.04, gold:0.92, baseHp:16, prep:12}
};

const STRATS = ['furthest', 'nearest', 'strongest'];
const STRAT_NAMES = {furthest:'最前', nearest:'最近', strongest:'血量最高'};

/* ============================================================
   2. 音频引擎（Web Audio 合成，零资源）
============================================================ */
const AudioSys = {
  ctx:null, master:null, musicGain:null, muted:false,
  _laserGain:null, _musOn:false, _musTimer:null, _musNext:0, _step:0,
  init(){
    if (this.ctx) return;
    if (!(window.AudioContext || window.webkitAudioContext)) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : 0.5;
    this.master.connect(this.ctx.destination);
    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0.13;
    this.musicGain.connect(this.master);
    // 激光持续音
    this._laserGain = this.ctx.createGain();
    this._laserGain.gain.value = 0;
    this._laserGain.connect(this.master);
    const osc = this.ctx.createOscillator(), lfo = this.ctx.createOscillator(), lg = this.ctx.createGain();
    osc.type = 'sawtooth'; osc.frequency.value = 170;
    lfo.type = 'sine'; lfo.frequency.value = 26; lg.gain.value = 30;
    lfo.connect(lg); lg.connect(osc.frequency);
    osc.connect(this._laserGain); osc.start(); lfo.start();
    this.startMusic();
  },
  resume(){ if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setMuted(m){ this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.5; },
  tone(f, dur, type, vol, delay, slide){
    if (!this.ctx) return;
    const t = this.ctx.currentTime + (delay || 0);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.03);
  },
  noise(dur, vol, freq, delay){
    if (!this.ctx) return;
    const t = this.ctx.currentTime + (delay || 0);
    const len = Math.max(1, (this.ctx.sampleRate * dur) | 0);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const fl = this.ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = freq || 800;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    src.connect(fl); fl.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.03);
  },
  laser(on){
    if (!this.ctx || !this._laserGain) return;
    this._laserGain.gain.setTargetAtTime(on ? 0.045 : 0, this.ctx.currentTime, 0.04);
  },
  play(name){
    if (!this.ctx || this.muted) return;
    switch (name){
      case 'place':     this.tone(520, 0.09, 'triangle', 0.25, 0, 260); this.noise(0.06, 0.12, 3000); break;
      case 'arrow':     this.noise(0.12, 0.14, 2400); this.tone(700, 0.05, 'square', 0.05); break;
      case 'cannon':    this.tone(150, 0.22, 'sine', 0.45, 0, -110); this.noise(0.18, 0.25, 700); break;
      case 'boom':      this.tone(90, 0.4, 'sine', 0.55, 0, -50); this.noise(0.35, 0.35, 400); break;
      case 'frost':     this.tone(1250, 0.18, 'sine', 0.2, 0, -650); break;
      case 'death':     this.tone(380, 0.16, 'square', 0.18, 0, -280); this.noise(0.1, 0.12, 1500); break;
      case 'bossDeath': this.tone(200, 0.6, 'sawtooth', 0.4, 0, -140); this.noise(0.5, 0.35, 300); break;
      case 'upgrade':   this.tone(523, 0.07, 'square', 0.15); this.tone(659, 0.07, 'square', 0.15, 0.07); this.tone(784, 0.12, 'square', 0.15, 0.14); break;
      case 'waveStart': this.tone(392, 0.12, 'square', 0.2); this.tone(523, 0.2, 'square', 0.2, 0.12); break;
      case 'bossWarn':  this.tone(220, 0.4, 'sawtooth', 0.28, 0, -40); this.tone(165, 0.5, 'sawtooth', 0.28, 0.3, -30); break;
      case 'leak':      this.tone(220, 0.3, 'sawtooth', 0.38, 0, -130); break;
      case 'sell':      this.tone(520, 0.1, 'triangle', 0.18, 0, -260); break;
      case 'deny':      this.tone(160, 0.12, 'square', 0.18); break;
      case 'click':     this.tone(800, 0.05, 'square', 0.1); break;
      case 'heal':      this.tone(660, 0.15, 'sine', 0.18, 0, 220); break;
      case 'summon':    this.tone(300, 0.2, 'sawtooth', 0.22, 0, 200); break;
      case 'win':       [523,659,784,1046,784,1046].forEach((f,i)=>this.tone(f,0.16,'square',0.18,i*0.13)); break;
      case 'lose':      [392,330,262,196].forEach((f,i)=>this.tone(f,0.3,'sawtooth',0.2,i*0.22)); break;
    }
  },
  startMusic(){
    if (this._musOn || !this.ctx) return;
    this._musOn = true;
    this._musNext = this.ctx.currentTime + 0.15;
    this._musTimer = setInterval(() => {
      if (!this.ctx) return;
      const ahead = this.ctx.currentTime + 0.35;
      while (this._musNext < ahead){
        this.schedStep(this._step, this._musNext);
        this._step = (this._step + 1) % 32;
        this._musNext += 60 / 118 / 2;
      }
    }, 120);
  },
  schedStep(step, t){
    if (!this.ctx) return;
    const g = this.ctx.createGain(); g.connect(this.musicGain);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    const bass = [110, 87.31, 130.81, 98];               // Am F C G
    const bf = bass[Math.floor(step / 8)];
    const mk = (f, dur, type, vol, dt) => {
      const o = this.ctx.createOscillator(); o.type = type; o.frequency.value = f;
      const gg = this.ctx.createGain();
      gg.gain.setValueAtTime(vol, t + dt); gg.gain.exponentialRampToValueAtTime(0.001, t + dt + dur);
      o.connect(gg); gg.connect(g); o.start(t + dt); o.stop(t + dt + dur + 0.02);
    };
    if (step % 2 === 0) mk(bf, 0.24, 'square', 0.45, 0);          // 贝斯
    const mel = [523.25,587.33,659.25,783.99,880,659.25,587.33,523.25,0,587.33,659.25,698.46,659.25,587.33,523.25,0];
    const n = mel[(step * 2) % 16];
    if (n > 0 && step % 2 === 1) mk(n, 0.22, 'triangle', 0.35, 0); // 旋律
    if (step % 2 === 1){                                          // 镲
      const len = (this.ctx.sampleRate * 0.03) | 0;
      const b = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = b.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const s = this.ctx.createBufferSource(); s.buffer = b;
      const fl = this.ctx.createBiquadFilter(); fl.type = 'highpass'; fl.frequency.value = 6000;
      const gg = this.ctx.createGain();
      gg.gain.setValueAtTime(0.1, t); gg.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
      s.connect(fl); fl.connect(gg); gg.connect(g); s.start(t); s.stop(t + 0.06);
    }
  }
};

function hrand(n){ const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }
function rr(ctx, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

class Enemy {
  constructor(key, hpScale, spdScale, summoned){
    const T = ENEMY_TYPES[key];
    this.key = key; this.name = T.name;
    this.maxHp = T.hp * hpScale * (summoned ? 0.5 : 1);
    this.hp = this.maxHp;
    this.speed = T.speed * spdScale;
    this.gold = T.gold * (summoned ? 0.5 : 1);
    this.leak = T.leak; this.r = T.r; this.color = T.color; this.shape = T.shape;
    this.flying = !!T.flying; this.slowResist = T.slowResist || 0;
    this.boss = !!T.boss; this.slowImmune = !!T.slowImmune;
    this.dead = false; this.flash = 0; this.slows = [];
    this.summoned = !!summoned;
    this.bob = Math.random() * 6.28;
    this.x = W_PX[0].x; this.y = W_PX[0].y;
    this.wpIndex = 0; this.progress = 0;
    if (this.boss){ this.bossSkillT = 5; this.bossSkillCount = 0; }
  }
  get slowFactor(){
    if (this.flying || this.slowImmune) return 1;
    let f = 1;
    for (const s of this.slows) f *= 1 - s.p * (1 - this.slowResist);
    return Math.max(0.15, f);
  }
  update(dt){
    this.flash = Math.max(0, this.flash - dt);
    for (let i = this.slows.length - 1; i >= 0; i--){
      this.slows[i].t -= dt;
      if (this.slows[i].t <= 0) this.slows.splice(i, 1);
    }
    const spd = this.speed * this.slowFactor;
    if (this.flying){
      const dx = BASE_PX.x - this.x, dy = BASE_PX.y - this.y, d = Math.hypot(dx, dy), step = spd * dt;
      if (d <= step){ this.x = BASE_PX.x; this.y = BASE_PX.y; this.progress += d; this.leakNow(); return; }
      this.x += dx / d * step; this.y += dy / d * step; this.progress += step;
    } else {
      if (this.wpIndex >= W_PX.length - 1){ this.leakNow(); return; }
      const t = W_PX[this.wpIndex + 1];
      const dx = t.x - this.x, dy = t.y - this.y, d = Math.hypot(dx, dy), step = spd * dt;
      if (d <= step){
        this.x = t.x; this.y = t.y; this.progress += d; this.wpIndex++;
        if (this.wpIndex >= W_PX.length - 1){ this.leakNow(); return; }
      } else {
        this.x += dx / d * step; this.y += dy / d * step; this.progress += step;
      }
      if (this.boss) this.bossSkill(dt);
    }
  }
  bossSkill(dt){
    this.bossSkillT -= dt;
    if (this.bossSkillT > 0) return;
    this.bossSkillT = 8;
    this.bossSkillCount++;
    if (this.bossSkillCount % 2 === 1){
      // 回血
      const heal = this.maxHp * 0.07;
      this.hp = Math.min(this.maxHp, this.hp + heal);
      bossHeals++;
      addText(this.x, this.y - this.r - 16, '+' + Math.round(heal), '#7dff9a', 13);
      burst(this.x, this.y, '#7dff9a', 7, 70, 0.55, 2.5);
      AudioSys.play('heal');
    } else {
      // 召唤小怪（在 Boss 当前位置出生，与 Boss 走同一段剩余路径）
      for (let i = 0; i < 3; i++){
        const m = new Enemy('normal', waveHpScale, waveSpdScale, true);
        m.x = this.x + (i - 0.5) * 14; m.y = this.y; m.wpIndex = this.wpIndex;
        enemies.push(m);
        ring(m.x, m.y, 6, 26, 0.45, '#b06bff', 3);
      }
      bossSpawns++;
      addText(this.x, this.y - this.r - 16, '召唤小怪！', '#c98bff', 13);
      AudioSys.play('summon');
    }
  }
  leakNow(){
    if (this.dead) return;
    this.dead = true;
    baseHp -= this.leak;
    redFlash = 0.55; shake = 5;
    AudioSys.play('leak');
    addText(BASE_PX.x - 24, BASE_PX.y - 34, '-' + this.leak + ' ❤', '#ff6b6b', 16);
    if (baseHp <= 0){ baseHp = 0; gameOver(false); }
  }
  takeDamage(d, flash){
    this.hp -= d; this.flash = flash === undefined ? 0.08 : flash;
    if (this.hp <= 0 && !this.dead){
      this.dead = true;
      gold += this.gold; totalEarned += this.gold; kills++;
      AudioSys.play(this.boss ? 'bossDeath' : 'death');
      addText(this.x, this.y - this.r - 8, '+' + Math.round(this.gold) + '金', '#ffd93d', 13);
      burst(this.x, this.y, this.color, 10, 90, 0.5, 3);
      if (this.boss){ shake = 10; ring(this.x, this.y, 10, 90, 0.6, '#ffb347', 4); }
    }
  }
}

class Tower {
  constructor(key, cx, cy){
    this.key = key;
    this.type = TOWER_TYPES[key];
    this.x = (cx + 0.5) * CELL;
    this.y = TOP + (cy + 0.5) * CELL;
    this.lv = 0; this.cd = 0; this.angle = -Math.PI / 2;
    this.target = null; this.beamT = 0;
    this.totalCost = this.type.cost;
    this.dmgAcc = 0; this.laserOn = false;
  }
  get st(){ return this.type.lvls[this.lv]; }
  canHit(e){ return !e.flying || this.type.antiAir; }
  update(dt){
    this.cd = Math.max(0, this.cd - dt);
    // 索敌
    let best = null, bv = -Infinity;
    const st = this.st;
    for (const e of enemies){
      if (e.dead || !this.canHit(e)) continue;
      const d = Math.hypot(e.x - this.x, e.y - this.y);
      if (d > st.range) continue;
      let v;
      if (strategy === 'furthest') v = e.progress;
      else if (strategy === 'strongest') v = e.hp;
      else v = -d;
      if (v > bv){ bv = v; best = e; }
    }
    this.target = best;
    if (this.target) this.angle = Math.atan2(this.target.y - this.y, this.target.x - this.x);
    if (this.key === 'laser'){
      if (this.target){
        const d = Math.hypot(this.target.x - this.x, this.target.y - this.y);
        const dps = st.dps * (0.7 + 1.3 * Math.min(1, d / st.range));
        const dmg = dps * dt;
        this.target.takeDamage(dmg, 0.03);
        this.beamT = 0.06;
        this.dmgAcc += dmg;
        if (this.dmgAcc >= 4){
          addText(this.target.x, this.target.y - this.target.r - 6, Math.round(this.dmgAcc), '#9ff3ff', 11);
          this.dmgAcc = 0;
        }
        if (!this.laserOn){ AudioSys.laser(true); this.laserOn = true; }
        if (Math.random() < dt * 14) burst(this.target.x, this.target.y, '#7fe9ff', 1, 50, 0.22, 2);
      } else if (this.laserOn){
        AudioSys.laser(false); this.laserOn = false;
      }
    } else if (this.target && this.cd <= 0){
      this.fire();
      this.cd = 1 / st.rate;
    }
    this.beamT = Math.max(0, this.beamT - dt);
  }
  fire(){
    const st = this.st;
    if (this.key === 'frost'){
      const e = this.target;
      e.takeDamage(st.dmg, 0.07);
      if (!e.flying && !e.slowImmune){
        e.slows.push({p: st.slow, t: st.slowDur});
        if (e.slows.length > 4) e.slows.shift();
      }
      beams.push({x1:this.x, y1:this.y, x2:e.x, y2:e.y, t:0, life:0.16, color:'#9fe8ff'});
      ring(e.x, e.y, 4, 16, 0.3, '#9fe8ff', 2);
      addText(e.x, e.y - e.r - 6, Math.round(st.dmg), '#cdefff', 10);
      AudioSys.play('frost');
    } else {
      projs.push(new Projectile(this));
      AudioSys.play(this.key === 'cannon' ? 'cannon' : 'arrow');
    }
  }
}

class Projectile {
  constructor(tower){
    const st = tower.st;
    this.tower = tower;
    this.x = tower.x; this.y = tower.y - 6;
    this.tx = tower.target.x; this.ty = tower.target.y;
    this.trailX = this.x; this.trailY = this.y;
    this.target = tower.target;
    this.speed = tower.type.projSpeed;
    this.dmg = st.dmg;
    this.splash = st.splash || 0;
    this.key = tower.key;
    this.dead = false;
  }
  update(dt){
    if (this.target && !this.target.dead){ this.tx = this.target.x; this.ty = this.target.y; }
    const dx = this.tx - this.x, dy = this.ty - this.y, d = Math.hypot(dx, dy), step = this.speed * dt;
    this.trailX = this.x; this.trailY = this.y;
    if (d <= step + 4){ this.x = this.tx; this.y = this.ty; this.impact(); this.dead = true; return; }
    this.x += dx / d * step; this.y += dy / d * step;
  }
  impact(){
    if (this.splash > 0){
      // 炮塔溅射（仅地面单位）
      ring(this.x, this.y, 6, this.splash, 0.4, '#ffb347', 3);
      burst(this.x, this.y, '#ff6b35', 10, 140, 0.4, 3);
      burst(this.x, this.y, '#ffd700', 8, 90, 0.5, 2);
      AudioSys.play('boom');
      for (const e of enemies){
        if (e.dead || e.flying) continue;
        if (Math.hypot(e.x - this.x, e.y - this.y) <= this.splash + e.r * 0.5){
          e.takeDamage(this.dmg);
          addText(e.x, e.y - e.r - 6, Math.round(this.dmg), '#ffd27d', 11);
        }
      }
    } else {
      const e = this.target;
      if (e && !e.dead){
        e.takeDamage(this.dmg);
        addText(e.x, e.y - e.r - 6, Math.round(this.dmg), '#ffffff', 11);
      }
    }
  }
}

/* ============================================================
   7. 特效
============================================================ */
function burst(x, y, color, n, spd, life, size){
  for (let i = 0; i < n; i++){
    const a = Math.random() * 6.28, s = spd * (0.4 + Math.random() * 0.8);
    parts.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, t:0, life:life*(0.6+Math.random()*0.7), size:size*(0.6+Math.random()*0.8), color});
  }
}
function ring(x, y, r0, r1, life, color, width){
  rings.push({x, y, r0, r1, t:0, life, color, width});
}
function addText(x, y, text, color, size){
  texts.push({x, y, text, color, t:0, life:0.8, size:size || 12});
}
function updateEffects(dt){
  for (const p of parts){ p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt; }
  parts = parts.filter(p => p.t < p.life);
  for (const r of rings) r.t += dt;
  rings = rings.filter(r => r.t < r.life);
  for (const b of beams) b.t += dt;
  beams = beams.filter(b => b.t < b.life);
  for (const t of texts){ t.t += dt; t.y -= 32 * dt; }
  texts = texts.filter(t => t.t < t.life);
}

   8. 波次管理
============================================================ */
function startWave(){
  phase = 'wave'; spawnElapsed = 0; queue = [];
  const w = WAVES[waveIndex - 1];
  let total = 0;
  for (const c of w.comps) total += c[1];
  const dur = Math.min(30, 6 + total * 0.55);
  const gap = dur / total;
  let t = 0;
  for (const [type, count] of w.comps){
    for (let i = 0; i < count; i++){
      queue.push({t: Math.max(0, t + (Math.random() - 0.5) * 0.5), type});
      t += gap;
    }
  }
  queue.sort((a, b) => a.t - b.t);
  waveHpScale = 1 + 0.32 * (waveIndex - 1);
  waveSpdScale = Math.min(1.35, 1 + 0.02 * (waveIndex - 1));
  const isBoss = BOSS_WAVES.has(waveIndex);
  showBanner(isBoss ? ('⚠️ 第 ' + waveIndex + ' 波 · BOSS 来袭 ⚠️') : ('第 ' + waveIndex + ' 波来袭！'), isBoss);
  AudioSys.play(isBoss ? 'bossWarn' : 'waveStart');
}
function clearWave(){
  if (gameState !== 'playing') return;
  const cleared = waveIndex;
  const bonus = 40 + 8 * cleared;
  gold += bonus; totalEarned += bonus;
  addText(W / 2, TOP + 70, '第 ' + cleared + ' 波清除！ +' + bonus + '金', '#ffd93d', 17);
  AudioSys.play('upgrade');
  if (cleared >= WAVES.length){ gameOver(true); return; }
  waveIndex = cleared + 1;
  phase = 'intermission'; interT = diff.prep;
  if (BOSS_WAVES.has(waveIndex)){
    showBanner('⚠️ 警告：Boss 波即将来袭！⚠️', true);
    AudioSys.play('bossWarn');
  }
}
function earlyStart(){
  if (phase !== 'intermission' || gameState !== 'playing') return;
  const bonus = 25 + 4 * waveIndex;
  gold += bonus; totalEarned += bonus;
  addText(W / 2, TOP + 70, '提前开始！ +' + bonus + '金', '#ffd93d', 17);
  startWave();
}
function spawnEnemy(type){
  const e = new Enemy(type, waveHpScale, waveSpdScale, false);
  enemies.push(e);
  burst(W_PX[0].x + 8, W_PX[0].y, '#9b5de5', 5, 60, 0.3, 2.5);
}

function gameOver(win){
  if (gameState === 'over') return;
  gameState = 'over';
  buildType = null; selTower = null;
  AudioSys.laser(false);
  const title = $('endTitle');
  if (win){
    const score = 1000 + (waveIndex - 1) * 150 + Math.max(0, baseHp) * 50 + kills * 10;
    title.textContent = '🎉 全部波次已清除！';
    title.className = 'win';
    $('endSub').textContent = '恭喜你守住了全部 ' + WAVES.length + ' 波进攻！';
    $('endScore').textContent = '总评分：' + score;
  } else {
    title.textContent = '💥 基地被摧毁';
    title.className = 'lose';
    $('endSub').textContent = '坚持到了第 ' + Math.min(waveIndex, WAVES.length) + ' 波（共 ' + WAVES.length + ' 波）';
    $('endScore').textContent = '—';
  }
  $('endStats').textContent = '剩余生命 ' + Math.max(0, baseHp) + ' · 击杀敌人 ' + kills + ' · 获得金币 ' + Math.floor(totalEarned);
  $('endScreen').classList.remove('hidden');
  AudioSys.play(win ? 'win' : 'lose');
}
function togglePause(){
  if (gameState === 'playing'){
    gameState = 'paused';
    $('pauseMenu').classList.remove('hidden');
    $('towerPanel').classList.add('hidden');
  } else if (gameState === 'paused'){
    gameState = 'playing';
    $('pauseMenu').classList.add('hidden');
  }
}

/* ============================================================
   10. 主更新
============================================================ */
function remaining(){ return queue.length + enemies.length; }

function update(dt){
  gameTime += dt; dayT += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 18);
  redFlash = Math.max(0, redFlash - dt * 1.6);

  // 波次
  if (phase === 'intermission'){
    interT -= dt;
    if (interT <= 0) startWave();
  } else {
    spawnElapsed += dt;
    while (queue.length && queue[0].t <= spawnElapsed) spawnEnemy(queue.shift().type);
    if (!queue.length && !enemies.length) clearWave();
  }

  for (const e of enemies) e.update(dt);
  enemies = enemies.filter(e => !e.dead);
  for (const t of towers) t.update(dt);
  for (const p of projs) p.update(dt);
  projs = projs.filter(p => !p.dead);
  updateEffects(dt);
  refreshHUD();
}

/* ============================================================
   11. 绘制
============================================================ */
function draw(){
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawMap();
  drawBase();
  for (const t of towers) drawTower(t);
  drawEnemies();
  drawProjectiles();
  drawBeams();
  drawEffects();
  drawRangeAndPreview();
  drawTexts();
  // 昼夜
  const p = (dayT % 240) / 240;
  const night = Math.sin(p * Math.PI * 2 - Math.PI / 2);
  if (night > 0){
    ctx.fillStyle = 'rgba(20,30,90,' + (night * 0.16).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  // 基地受击红闪
  if (redFlash > 0){
    ctx.fillStyle = 'rgba(255,40,40,' + (redFlash * 0.45).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

function drawMap(){
  // 草地
  for (let cy = 0; cy < ROWS; cy++) for (let cx = 0; cx < COLS; cx++){
    const l = 38 + hrand(cx * 31 + cy * 57) * 12;
    ctx.fillStyle = 'hsl(105,45%,' + l.toFixed(1) + '%)';
    ctx.fillRect(cx * CELL, TOP + cy * CELL, CELL, CELL);
  }
  // 路径：深色描边 + 土路
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = '#6b4f2c'; ctx.lineWidth = 30;
  ctx.beginPath();
  for (let i = 0; i < W_PX.length; i++){ i ? ctx.lineTo(W_PX[i].x, W_PX[i].y) : ctx.moveTo(W_PX[i].x, W_PX[i].y); }
  ctx.stroke();
  ctx.strokeStyle = '#b08a5a'; ctx.lineWidth = 22; ctx.stroke();
  ctx.strokeStyle = '#d3b078'; ctx.lineWidth = 12; ctx.stroke();
  // 路径斑点
  for (let cy = 0; cy < ROWS; cy++) for (let cx = 0; cx < COLS; cx++){
    if (!pathGrid[cy][cx]) continue;
    if (hrand(cx * 71 + cy * 43) < 0.25){
      ctx.fillStyle = 'rgba(90,60,30,0.35)';
      ctx.beginPath();
      ctx.arc((cx + 0.5) * CELL, TOP + (cy + 0.5) * CELL, 2.5, 0, 6.28);
      ctx.fill();
    }
  }
  // 装饰
  for (const d of decos){
    if (d.kind === 'tuft'){
      ctx.strokeStyle = 'rgba(30,80,20,0.5)'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(d.x - 3, d.y); ctx.quadraticCurveTo(d.x - 2, d.y - 5, d.x - 4, d.y - 7);
      ctx.moveTo(d.x, d.y); ctx.quadraticCurveTo(d.x, d.y - 6, d.x, d.y - 8);
      ctx.moveTo(d.x + 3, d.y); ctx.quadraticCurveTo(d.x + 2, d.y - 5, d.x + 4, d.y - 7);
      ctx.stroke();
    } else {
      ctx.fillStyle = d.c;
      ctx.beginPath(); ctx.arc(d.x, d.y, 2, 0, 6.28); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.arc(d.x - 1, d.y - 1, 0.8, 0, 6.28); ctx.fill();
    }
  }
  // 出生点传送门
  const px = 16, py = TOP + 48, pulse = 0.5 + 0.5 * Math.sin(gameTime * 3);
  ctx.fillStyle = '#1a1030';
  ctx.beginPath(); ctx.arc(px, py, 15, 0, 6.28); ctx.fill();
  ctx.strokeStyle = 'rgba(155,93,229,' + (0.45 + pulse * 0.4).toFixed(2) + ')';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(px, py, 15, 0, 6.28); ctx.stroke();
  ctx.fillStyle = '#4a1d7a';
  ctx.beginPath(); ctx.arc(px, py, 8 + pulse * 2, 0, 6.28); ctx.fill();
  // 地图边框
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 3;
  ctx.strokeRect(0, TOP, MAP_W, MAP_H);
}

function drawBase(){
  const x = BASE_PX.x, y = BASE_PX.y;
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(x, y + 18, 28, 8, 0, 0, 6.28); ctx.fill();
  // 建筑
  rr(ctx, x - 22, y - 12, 44, 34, 6); ctx.fillStyle = '#c98d5a'; ctx.fill();
  ctx.strokeStyle = '#7c4a20'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = '#8a4b22';
  ctx.beginPath(); ctx.moveTo(x - 26, y - 12); ctx.lineTo(x, y - 30); ctx.lineTo(x + 26, y - 12); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#5e3115'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#4a2a10';
  rr(ctx, x - 7, y + 8, 14, 14, 3); ctx.fill();
  ctx.fillStyle = '#ffe27a';
  ctx.fillRect(x + 16, y - 26, 2, 14);
  ctx.fillStyle = '#e5533d';
  ctx.beginPath(); ctx.moveTo(x + 18, y - 26); ctx.lineTo(x + 34, y - 22); ctx.lineTo(x + 18, y - 18); ctx.closePath(); ctx.fill();
  // 基地血条
  const pct = Math.max(0, baseHp / baseMax);
  ctx.fillStyle = '#3a1020';
  rr(ctx, x - 28, y - 42, 56, 7, 3); ctx.fill();
  ctx.fillStyle = pct > 0.5 ? '#4ade80' : pct > 0.25 ? '#fbbf24' : '#ef4444';
  rr(ctx, x - 28, y - 42, 56 * pct, 7, 3); ctx.fill();
}

function drawTower(t){
  const x = t.x, y = t.y;
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(x, y + 11, 15, 5, 0, 0, 6.28); ctx.fill();
  const lv = t.lv;
  ctx.save();
  ctx.translate(x, y);
  if (t.key === 'arrow'){
    ctx.fillStyle = '#6b4423';
    rr(ctx, -12 - lv, -6 - lv, 24 + lv * 2, 18 + lv * 2, 4); ctx.fill();
    ctx.strokeStyle = '#3f2612'; ctx.lineWidth = 2; ctx.stroke();
    ctx.save(); ctx.rotate(t.angle);
    ctx.strokeStyle = '#a97f4d'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 8 + lv, -1.15, 1.15); ctx.stroke();
    ctx.strokeStyle = lv >= 2 ? '#ffd93d' : '#d9c9a8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(3, 0); ctx.lineTo(16 + lv * 2, 0); ctx.stroke();
    ctx.fillStyle = '#eee';
    ctx.beginPath(); ctx.moveTo(17 + lv * 2, 0); ctx.lineTo(13 + lv * 2, -4); ctx.lineTo(13 + lv * 2, 4); ctx.closePath(); ctx.fill();
    ctx.restore();
    if (lv >= 1){
      ctx.fillStyle = lv >= 2 ? '#ffd93d' : '#3fa34d';
      ctx.beginPath(); ctx.moveTo(-9, -7 - lv); ctx.lineTo(0, -17 - lv); ctx.lineTo(9, -7 - lv); ctx.closePath(); ctx.fill();
    }
    if (lv >= 2){
      ctx.fillStyle = '#e5533d';
      ctx.fillRect(0, -19 - lv, 2, 8);
      ctx.fillStyle = '#e5533d';
      ctx.beginPath(); ctx.moveTo(2, -19 - lv); ctx.lineTo(10, -17 - lv); ctx.lineTo(2, -15 - lv); ctx.closePath(); ctx.fill();
    }
  } else if (t.key === 'cannon'){
    ctx.fillStyle = '#4a4e5a';
    ctx.beginPath(); ctx.arc(0, 0, 11 + lv, 0, 6.28); ctx.fill();
    ctx.strokeStyle = '#262a33'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#3a3e48';
    ctx.beginPath(); ctx.arc(0, 0, 5 + lv * 0.7, 0, 6.28); ctx.fill();
    ctx.save(); ctx.rotate(t.angle);
    ctx.fillStyle = '#3a3e48';
    rr(ctx, -6, -5, 20 + lv * 4, 10, 3); ctx.fill();
    ctx.strokeStyle = '#22252d'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#1c1e25';
    rr(ctx, 11 + lv * 2, -7, 7, 14, 3); ctx.fill();
    if (lv >= 1){
      ctx.fillStyle = '#d94f3d';
      ctx.fillRect(4, -4, 3, 8);
    }
    if (lv >= 2){
      ctx.strokeStyle = '#ffd93d'; ctx.lineWidth = 2;
      rr(ctx, -3, -6.5, 8, 13, 3); ctx.stroke();
    }
    ctx.restore();
  } else if (t.key === 'frost'){
    ctx.fillStyle = '#5f8fc9';
    rr(ctx, -13 - lv, -5, 26 + lv * 2, 16, 5); ctx.fill();
    ctx.strokeStyle = '#3a5f8f'; ctx.lineWidth = 2; ctx.stroke();
    const nc = 3 + lv;
    for (let i = 0; i < nc; i++){
      const a = -Math.PI / 2 + (i - (nc - 1) / 2) * 0.55;
      const h = 9 + lv * 3;
      ctx.fillStyle = i % 2 ? '#7fd6ff' : '#9fe8ff';
      ctx.beginPath();
      ctx.moveTo(Math.cos(a - 0.28) * 8, Math.sin(a - 0.28) * 8);
      ctx.lineTo(Math.cos(a) * (8 + h), Math.sin(a) * (8 + h));
      ctx.lineTo(Math.cos(a + 0.28) * 8, Math.sin(a + 0.28) * 8);
      ctx.closePath(); ctx.fill();
    }
    const pulse = 0.5 + 0.5 * Math.sin(gameTime * 5);
    ctx.strokeStyle = 'rgba(159,232,255,' + (0.3 + pulse * 0.4) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 15 + lv * 2, 0, 6.28); ctx.stroke();
  } else { // laser
    ctx.fillStyle = '#2f3340';
    ctx.beginPath(); ctx.arc(0, 0, 11 + lv * 1.5, 0, 6.28); ctx.fill();
    ctx.strokeStyle = '#16181f'; ctx.lineWidth = 2.5; ctx.stroke();
    const pulse = 0.5 + 0.5 * Math.sin(gameTime * 6);
    ctx.fillStyle = '#00e5ff';
    ctx.beginPath(); ctx.arc(0, 0, 4 + lv, 0, 6.28); ctx.fill();
    ctx.strokeStyle = 'rgba(0,229,255,' + (0.35 + pulse * 0.45) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 7 + lv * 1.5, 0, 6.28); ctx.stroke();
    if (lv >= 2){
      ctx.strokeStyle = lv >= 2 ? '#ffd93d' : '#00e5ff';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 0, 12 + lv * 1.5, 0, 6.28); ctx.stroke();
    }
  }
  // 等级星标
  for (let i = 0; i <= lv; i++){
    ctx.fillStyle = '#ffd93d';
    ctx.fillRect(-8 + i * 7, -22 - lv, 4, 4);
  }
  ctx.restore();
}

function drawEnemies(){
  for (const e of enemies){
    const bob = e.flying ? 0 : Math.sin(gameTime * 9 + e.bob) * 1.6;
    const ey = e.y + bob;
    if (e.flying){
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath(); ctx.ellipse(e.x, e.y + 14, 9, 3.5, 0, 0, 6.28); ctx.fill();
    }
    ctx.save();
    ctx.translate(e.x, ey);
    const tgt = e.flying ? BASE_PX : (e.wpIndex < W_PX.length - 1 ? W_PX[e.wpIndex + 1] : BASE_PX);
    const ang = Math.atan2(tgt.y - e.y, tgt.x - e.x);
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 2;

    if (e.shape === 'tri'){
      ctx.save(); ctx.rotate(ang);
      ctx.fillStyle = e.color;
      ctx.beginPath();
      ctx.moveTo(e.r + 3, 0); ctx.lineTo(-e.r + 2, -e.r + 1); ctx.lineTo(-e.r + 2, e.r - 1);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(2, -2.5, 1.8, 0, 6.28); ctx.arc(2, 2.5, 1.8, 0, 6.28); ctx.fill();
      ctx.restore();
    } else if (e.shape === 'hex'){
      ctx.fillStyle = e.color;
      ctx.beginPath();
      for (let i = 0; i < 6; i++){
        const a = Math.PI / 6 + i * Math.PI / 3;
        i ? ctx.lineTo(Math.cos(a) * e.r, Math.sin(a) * e.r) : ctx.moveTo(Math.cos(a) * e.r, Math.sin(a) * e.r);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.beginPath();
      for (let i = 0; i < 6; i++){
        const a = Math.PI / 6 + i * Math.PI / 3;
        i ? ctx.lineTo(Math.cos(a) * e.r * 0.6, Math.sin(a) * e.r * 0.6) : ctx.moveTo(Math.cos(a) * e.r * 0.6, Math.sin(a) * e.r * 0.6);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-3, -3, 2, 0, 6.28); ctx.arc(-3, 3, 2, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(-3, -3, 1, 0, 6.28); ctx.arc(-3, 3, 1, 0, 6.28); ctx.fill();
    } else if (e.shape === 'bat'){
      ctx.save(); ctx.rotate(ang);
      const flap = Math.sin(gameTime * 16 + e.bob) * 0.55;
      ctx.fillStyle = e.color;
      ctx.beginPath(); ctx.arc(0, 0, e.r, 0, 6.28); ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-2, -2); ctx.quadraticCurveTo(-e.r - 4, -6 - flap * 8, -e.r - 8, -4 - flap * 10);
      ctx.lineTo(-e.r - 2, 0); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-2, 2); ctx.quadraticCurveTo(-e.r - 4, 6 + flap * 8, -e.r - 8, 4 + flap * 10);
      ctx.lineTo(-e.r - 2, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(2, -2.5, 1.7, 0, 6.28); ctx.arc(2, 2.5, 1.7, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#5a2a8a';
      ctx.beginPath(); ctx.arc(2.5, -2.5, 0.9, 0, 6.28); ctx.arc(2.5, 2.5, 0.9, 0, 6.28); ctx.fill();
      ctx.restore();
    } else if (e.shape === 'boss'){
      ctx.fillStyle = e.color;
      ctx.beginPath(); ctx.arc(0, 0, e.r, 0, 6.28); ctx.fill();
      ctx.strokeStyle = '#3d1010'; ctx.lineWidth = 3.5; ctx.stroke();
      // 角
      ctx.fillStyle = '#5c1a1a';
      ctx.beginPath(); ctx.moveTo(-e.r * 0.7, -e.r * 0.4); ctx.lineTo(-e.r * 1.15, -e.r * 1.15); ctx.lineTo(-e.r * 0.2, -e.r * 0.75); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(e.r * 0.7, -e.r * 0.4); ctx.lineTo(e.r * 1.15, -e.r * 1.15); ctx.lineTo(e.r * 0.2, -e.r * 0.75); ctx.closePath(); ctx.fill();
      // 王冠
      ctx.fillStyle = '#ffd93d';
      ctx.beginPath();
      ctx.moveTo(-10, -e.r + 2); ctx.lineTo(-10, -e.r - 6); ctx.lineTo(-5, -e.r - 1);
      ctx.lineTo(0, -e.r - 8); ctx.lineTo(5, -e.r - 1); ctx.lineTo(10, -e.r - 6); ctx.lineTo(10, -e.r + 2);
      ctx.closePath(); ctx.fill();
      // 眼睛
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-8, -3, 5, 0, 6.28); ctx.arc(8, -3, 5, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#c8102e';
      ctx.beginPath(); ctx.arc(-6, -3, 2.4, 0, 6.28); ctx.arc(10, -3, 2.4, 0, 6.28); ctx.fill();
      ctx.strokeStyle = '#3d1010'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(-14, 8); ctx.lineTo(-6, 3); ctx.moveTo(14, 8); ctx.lineTo(6, 3); ctx.stroke();
    } else { // circle 普通兵
      ctx.fillStyle = e.color;
      ctx.beginPath(); ctx.arc(0, 0, e.r, 0, 6.28); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-3, -2.5, 2, 0, 6.28); ctx.arc(3, -2.5, 2, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(-3, -2.5, 1, 0, 6.28); ctx.arc(3, -2.5, 1, 0, 6.28); ctx.fill();
    }
    // 减速光环
    if (e.slows.length){
      ctx.strokeStyle = 'rgba(160,230,255,0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, e.r + 4, 0, 6.28); ctx.stroke();
      ctx.fillStyle = 'rgba(220,248,255,0.9)';
      ctx.beginPath(); ctx.arc(-e.r - 2, -e.r - 2, 1.5, 0, 6.28); ctx.fill();
      ctx.beginPath(); ctx.arc(e.r + 1, -e.r + 4, 1.3, 0, 6.28); ctx.fill();
      ctx.beginPath(); ctx.arc(-e.r + 3, e.r + 2, 1.5, 0, 6.28); ctx.fill();
    }
    // 受击闪白
    if (e.flash > 0){
      ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.85, e.flash * 7).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(0, 0, e.r + 1, 0, 6.28); ctx.fill();
    }
    ctx.restore();
    // 血条
    if (e.hp < e.maxHp){
      const w = e.boss ? 52 : 26, hh = e.boss ? 6 : 4;
      const bx = e.x - w / 2, by = ey - e.r - (e.boss ? 34 : 12);
      const pct = Math.max(0, e.hp / e.maxHp);
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(bx - 1, by - 1, w + 2, hh + 2);
      ctx.fillStyle = pct > 0.5 ? '#4ade80' : pct > 0.25 ? '#fbbf24' : '#ef4444';
      ctx.fillRect(bx, by, w * pct, hh);
      if (e.boss){
        ctx.fillStyle = '#ff8f8f';
        ctx.font = 'bold 10px "Courier New",monospace';
        ctx.textAlign = 'center';
        ctx.fillText('BOSS', e.x, by - 4);
      }
    }
  }
}

function drawProjectiles(){
  for (const p of projs){
    if (p.key === 'cannon'){
      ctx.strokeStyle = 'rgba(255,180,100,0.45)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(p.trailX, p.trailY); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.fillStyle = '#2e2e34';
      ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#8f8f9c';
      ctx.beginPath(); ctx.arc(p.x - 1.5, p.y - 1.5, 1.8, 0, 6.28); ctx.fill();
    } else {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(Math.atan2(p.ty - p.y, p.tx - p.x));
      ctx.strokeStyle = '#d9c9a8'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(6, 0); ctx.stroke();
      ctx.fillStyle = '#eee';
      ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(3, -3); ctx.lineTo(3, 3); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
}

function drawBeams(){
  // 冰霜瞬发射线
  for (const b of beams){
    const a = 1 - b.t / b.life;
    ctx.strokeStyle = b.color; ctx.globalAlpha = a * 0.9; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    ctx.globalAlpha = a * 0.35; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // 激光持续射线
  for (const t of towers){
    if (t.key !== 'laser' || t.beamT <= 0 || !t.target || t.target.dead) continue;
    const wob = Math.sin(gameTime * 42) * 2;
    const x2 = t.target.x, y2 = t.target.y;
    const grad = ctx.createLinearGradient(t.x, t.y, x2, y2);
    grad.addColorStop(0, '#7fe9ff');
    grad.addColorStop(0.6, '#00aaff');
    grad.addColorStop(1, '#ffffff');
    ctx.strokeStyle = 'rgba(0,229,255,0.22)'; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(x2 + wob, y2 - wob); ctx.stroke();
    ctx.strokeStyle = grad; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(x2 + wob, y2 - wob); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(x2 + wob, y2 - wob); ctx.stroke();
  }
}

function drawEffects(){
  for (const p of parts){
    const a = 1 - p.t / p.life;
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  for (const r of rings){
    const k = r.t / r.life;
    const rad = r.r0 + (r.r1 - r.r0) * k;
    ctx.globalAlpha = Math.max(0, (1 - k) * 0.9);
    ctx.strokeStyle = r.color;
    ctx.lineWidth = r.width;
    ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, 6.28); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawTexts(){
  ctx.textAlign = 'center';
  for (const t of texts){
    const a = Math.max(0, 1 - t.t / t.life);
    ctx.globalAlpha = a;
    ctx.font = 'bold ' + t.size + 'px "Courier New",monospace';
    ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineWidth = 3;
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

function drawRangeAndPreview(){
  // 选中塔：射程圈 + 格子高亮
  if (selTower){
    const st = selTower.st;
    ctx.setLineDash([6, 6]);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(selTower.x, selTower.y, st.range, 0, 6.28); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = '#ffd93d'; ctx.lineWidth = 2;
    const cx = Math.floor(selTower.x / CELL), cy = Math.floor((selTower.y - TOP) / CELL);
    ctx.strokeRect(cx * CELL + 1, TOP + cy * CELL + 1, CELL - 2, CELL - 2);
  }
  // 放置预览
  if (buildType && hoverCell){
    const {cx, cy} = hoverCell;
    const T = TOWER_TYPES[buildType];
    const valid = !pathGrid[cy][cx] && !towerAt({cx, cy}) && gold >= T.cost;
    const px = (cx + 0.5) * CELL, py = TOP + (cy + 0.5) * CELL;
    ctx.fillStyle = valid ? 'rgba(90,220,90,0.35)' : 'rgba(220,60,60,0.4)';
    ctx.fillRect(cx * CELL, TOP + cy * CELL, CELL, CELL);
    ctx.strokeStyle = valid ? '#5ade5a' : '#ef4444';
    ctx.lineWidth = 2;
    ctx.strokeRect(cx * CELL + 1, TOP + cy * CELL + 1, CELL - 2, CELL - 2);
    ctx.setLineDash([6, 6]);
    ctx.strokeStyle = valid ? 'rgba(90,220,90,0.5)' : 'rgba(220,60,60,0.5)';
    ctx.beginPath(); ctx.arc(px, py, T.lvls[0].range, 0, 6.28); ctx.stroke();
    ctx.setLineDash([]);
    const tmp = {key: buildType, type: T, lv: 0, angle: -Math.PI / 2, x: px, y: py};
    ctx.globalAlpha = 0.6;
    drawTower(tmp);
    ctx.globalAlpha = 1;
  }
}

/* ============================================================
   12. 输入
============================================================ */
let mouse = {x: -1, y: -1};
function toGame(e){
  const r = cv.getBoundingClientRect();
  return {x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height};
}
function cellAt(x, y){
  const cx = Math.floor(x / CELL), cy = Math.floor((y - TOP) / CELL);
  if (cx < 0 || cx >= COLS || cy < 0 || cy >= ROWS) return null;
  return {cx, cy};
}
function towerAt(cell){
  for (const t of towers){
    if (Math.floor(t.x / CELL) === cell.cx && Math.floor((t.y - TOP) / CELL) === cell.cy) return t;
  }
  return null;
}
function tryPlace(cell){
  const T = TOWER_TYPES[buildType];
  if (gold < T.cost){ AudioSys.play('deny'); return; }
  if (pathGrid[cell.cy][cell.cx]){ AudioSys.play('deny'); return; }
  if (towerAt(cell)){ AudioSys.play('deny'); return; }
  gold -= T.cost;
  towers.push(new Tower(buildType, cell.cx, cell.cy));
  AudioSys.play('place');
  burst((cell.cx + 0.5) * CELL, TOP + (cell.cy + 0.5) * CELL, '#c9d6ff', 8, 80, 0.35, 2.5);
  refreshHUD();
}
function cancelPlace(){ buildType = null; refreshHUD(); }
function setBuildType(key){
  if (gameState !== 'playing') return;
  buildType = buildType === key ? null : key;
  selTower = null;
  $('towerPanel').classList.add('hidden');
  AudioSys.play('click');
  refreshHUD();
}
function upgradeSelected(){
  if (gameState !== 'playing' || !selTower) return;
  const t = selTower;
  if (t.lv >= t.type.up.length) return;
  const cost = t.type.up[t.lv];
  if (gold < cost){ AudioSys.play('deny'); return; }
  gold -= cost; t.totalCost += cost; t.lv++;
  AudioSys.play('upgrade');
  burst(t.x, t.y, '#ffd93d', 10, 90, 0.5, 2.5);
  updatePanel(); refreshHUD();
}
function sellSelected(){
  if (gameState !== 'playing' || !selTower) return;
  const t = selTower;
  const refund = Math.round(t.totalCost * 0.6);
  gold += refund; totalEarned += refund;
  towers.splice(towers.indexOf(t), 1);
  selTower = null;
  $('towerPanel').classList.add('hidden');
  AudioSys.play('sell');
  addText(t.x, t.y - 14, '+' + refund + '金', '#ffd93d', 14);
  refreshHUD();
}
function cycleStrategy(){
  stratIdx = (stratIdx + 1) % 3;
  strategy = STRATS[stratIdx];
  refreshHUD();
}
function toggleMute(){
  AudioSys.setMuted(!AudioSys.muted);
  refreshHUD();
}

cv.addEventListener('mousemove', e => {
  mouse = toGame(e);
  hoverCell = cellAt(mouse.x, mouse.y);
});
cv.addEventListener('mousedown', e => {
  if (e.button === 2){ cancelPlace(); return; }
  if (e.button !== 0) return;
  if (gameState !== 'playing') return;
  if (!hoverCell) return;
  if (buildType) tryPlace(hoverCell);
  else {
    const t = towerAt(hoverCell);
    selTower = t;
    if (t){ updatePanel(); AudioSys.play('click'); }
    else $('towerPanel').classList.add('hidden');
  }
});
cv.addEventListener('mouseleave', () => { hoverCell = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === ' ' || k.startsWith('Arrow')) e.preventDefault();
  if (gameState === 'menu' || gameState === 'over'){
    if (k === 'Enter') startGame();
    return;
  }
  if (k === '1') setBuildType('arrow');
  else if (k === '2') setBuildType('cannon');
  else if (k === '3') setBuildType('frost');
  else if (k === '4') setBuildType('laser');
  else if (k === 'u' || k === 'U') upgradeSelected();
  else if (k === 's' || k === 'S') sellSelected();
  else if (k === 'p' || k === 'P') togglePause();
  else if (k === 'm' || k === 'M') toggleMute();
  else if (k === 't' || k === 'T') cycleStrategy();
  else if (k === 'Escape'){
    if (buildType) cancelPlace();
    else if (gameState === 'paused') togglePause();
    else if (gameState === 'playing') togglePause();
  }
  else if (k === ' ' && gameState === 'playing' && phase === 'intermission') earlyStart();
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('wheel', e => e.preventDefault(), {passive:false});
document.addEventListener('touchmove', e => e.preventDefault(), {passive:false});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && gameState === 'playing') togglePause();
});

/* ============================================================
   13. UI 绑定与刷新
============================================================ */
function refreshHUD(){
  $('hudGold').textContent = Math.floor(gold);
  const pct = Math.max(0, baseHp / baseMax * 100);
  $('hudHpFill').style.width = pct.toFixed(1) + '%';
  $('hudHpFill').style.background = pct > 50 ? '#4ade80' : pct > 25 ? '#fbbf24' : '#ef4444';
  $('hudHpText').textContent = Math.max(0, baseHp) + '/' + baseMax;
  $('hudWave').textContent = '第 ' + Math.min(waveIndex, WAVES.length) + ' / ' + WAVES.length + ' 波';
  $('hudPhase').textContent = phase === 'intermission'
    ? '准备时间 ' + Math.ceil(Math.max(0, interT)) + 's · 下一波：第 ' + Math.min(waveIndex, WAVES.length) + ' 波'
    : '战斗中 · 本波剩余 ' + remaining() + ' 个敌人';
  $('btnEarly').style.display = (phase === 'intermission' && gameState === 'playing') ? 'inline-block' : 'none';
  $('btnEarly').textContent = '⏩ 提前开始 (+' + (25 + 4 * waveIndex) + '金)';
  $('btnStrategy').textContent = '🎯 ' + STRAT_NAMES[strategy];
  $('btnMute').textContent = AudioSys.muted ? '🔇' : '🔊';
  for (const k of ['arrow', 'cannon', 'frost', 'laser']){
    const b = $('btnBuild-' + k);
    b.classList.toggle('off', gold < TOWER_TYPES[k].cost);
    b.classList.toggle('sel', buildType === k);
  }
  cv.style.cursor = buildType ? 'crosshair' : 'default';
}
function updatePanel(){
  const t = selTower;
  if (!t) return;
  const st = t.st, ty = t.type;
  const upCost = t.lv < ty.up.length ? ty.up[t.lv] : 0;
  const next = t.lv < ty.lvls.length - 1 ? ty.lvls[t.lv + 1] : null;
  const refund = Math.round(t.totalCost * 0.6);
  let rows = '';
  rows += '<div class="p-title">' + ty.name + ' <span class="lv">Lv.' + (t.lv + 1) + '/3</span></div>';
  if (ty.key === 'laser'){
    rows += '<div class="p-row">伤害 <span>' + st.dps + '/秒（距离越远越高）</span></div>';
    if (t.target && !t.target.dead){
      const d = Math.hypot(t.target.x - t.x, t.target.y - t.y);
      const mult = (0.7 + 1.3 * Math.min(1, d / st.range)).toFixed(2);
      rows += '<div class="p-row">当前倍率 <span>' + mult + '×</span></div>';
    }
  } else {
    rows += '<div class="p-row">伤害 <span>' + st.dmg + '</span></div>';
    rows += '<div class="p-row">攻速 <span>每秒 ' + st.rate + ' 次</span></div>';
  }
  rows += '<div class="p-row">射程 <span>' + st.range + '</span></div>';
  if (st.splash) rows += '<div class="p-row">溅射 <span>' + st.splash + '</span></div>';
  if (st.slow) rows += '<div class="p-row">减速 <span>' + Math.round(st.slow * 100) + '% · ' + st.slowDur + 's</span></div>';
  if (next){
    const nd = ty.key === 'laser' ? (next.dps + '/秒') : next.dmg;
    rows += '<div class="p-next">升级后：伤害 ' + (ty.key === 'laser' ? st.dps : st.dmg) + ' → ' + nd + '</div>';
  }
  $('panelBody').innerHTML = rows;
  const ub = $('btnUpgrade');
  if (t.lv >= ty.up.length){ ub.textContent = '已满级'; ub.disabled = true; }
  else { ub.textContent = '升级 ' + upCost + '金'; ub.disabled = gold < upCost; }
  const sb = $('btnSell');
  sb.textContent = '出售 +' + refund + '金';
  $('towerPanel').classList.remove('hidden');
}

for (const k of ['arrow', 'cannon', 'frost', 'laser'])
  $('btnBuild-' + k).addEventListener('click', () => setBuildType(k));
$('btnPause').addEventListener('click', togglePause);
$('btnMute').addEventListener('click', toggleMute);
$('btnStrategy').addEventListener('click', cycleStrategy);
$('btnEarly').addEventListener('click', earlyStart);
$('btnUpgrade').addEventListener('click', upgradeSelected);
$('btnSell').addEventListener('click', sellSelected);
$('btnPauseResume').addEventListener('click', togglePause);
$('btnPauseRestart').addEventListener('click', startGame);
$('btnPauseMenu').addEventListener('click', toMenu);
$('btnEndRestart').addEventListener('click', startGame);
$('btnEndMenu').addEventListener('click', toMenu);
$('btnStart').addEventListener('click', startGame);
for (const d of ['easy', 'normal', 'hard'])
  $('diff-' + d).addEventListener('change', e => { if (e.target.checked) diff = DIFFS[e.target.value]; });

function showBanner(text, isBoss){
  const b = $('banner');
  b.textContent = text;
  b.classList.toggle('boss', !!isBoss);
  b.classList.remove('show');
  void b.offsetWidth;
  b.classList.add('show');
}

/* ============================================================
   14. 主循环与适配
============================================================ */
function fit(){
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  $('wrap').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit);
fit();

let lastTs = 0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, Math.max(0, (ts - lastTs) / 1000));
  lastTs = ts;
  if (gameState === 'playing') update(dt);
  draw();
}
requestAnimationFrame(loop);
</script>
